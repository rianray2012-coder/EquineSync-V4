<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EquineSync</title>
</head>
<body style="margin:0;padding:0;background:#232734;color:#F7F8FA;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#232734;padding:48px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="560" cellpadding="0" cellspacing="0" border="0" style="background:#2E3550;border:1px solid #39415C;border-radius:12px;overflow:hidden;">
          <!-- Header -->
          <tr>
            <td style="padding:32px 36px 24px 36px;border-bottom:1px solid #39415C;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="font-family:Georgia,'Cormorant Garamond',serif;font-size:22px;font-weight:400;letter-spacing:0.5px;color:#F7F8FA;">
                    EquineSync
                  </td>
                  <td align="right" style="font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:#B8AECF;">
                    Every Horse. Every Task. In Sync.
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <!-- Body -->
          <tr>
            <td style="padding:36px;color:#E3E6EB;line-height:1.65;font-size:15px;">
              {content}
            </td>
          </tr>
          <!-- Footer -->
          <tr>
            <td style="padding:24px 36px;border-top:1px solid #39415C;font-size:11px;color:#98A2B3;letter-spacing:0.3px;">
              You're receiving this email because an action was requested for your EquineSync account.
              <br/>If this wasn't you, you can safely ignore this message — no changes will be made.
              <br/><br/>
              <span style="color:#98A2B3;">© EquineSync · Every Horse. Every Task. In Sync.</span>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
