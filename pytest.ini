[pytest]
filterwarnings =
    ignore:Please use `import python_multipart` instead.:PendingDeprecationWarning:starlette.formparsers

# Applied automatically by `pytest_collection_modifyitems` in
# backend/tests/conftest.py. The `live` marker is explicit and reviewable via
# backend/tests/live_test_allowlist.txt; the other markers are preliminary
# per-test inventory signals. No marker skips anything by itself.
# See backend/tests/README.md.
markers =
    behavioral: preliminary per-test proxy for in-process FastAPI/TestClient behavioral coverage; not a complete validated count.
    live: explicitly allowlisted tests that talk to a running, seeded API over HTTP.
    artifact: preliminary per-test proxy for checks involving generated files under `outputs/`.
    sourcegrep: preliminary per-test proxy for source-text checks using `read_text()`.
