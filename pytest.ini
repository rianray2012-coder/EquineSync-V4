[pytest]
filterwarnings =
    ignore:Please use `import python_multipart` instead.:PendingDeprecationWarning:starlette.formparsers

# Applied automatically by `pytest_collection_modifyitems` in
# backend/tests/conftest.py, which inspects each module's source, so no test
# file needs editing. No marker skips anything — they exist only so a run can
# select a subset. CI gates on `-m "not live"`.
# See backend/tests/README.md.
markers =
    behavioral: exercises the app in-process via FastAPI TestClient; needs no network.
    live: talks to a running, seeded API over HTTP (module imports `requests` / calls `_base_url()`).
    artifact: asserts on generated files under `outputs/`, which is gitignored and absent in a clean checkout.
    sourcegrep: greps application source text with `read_text()` instead of executing it.
